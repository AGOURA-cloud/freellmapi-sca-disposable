name: AI-D0J-B exact audited lockfile isolated compatibility
on:
  push:
    paths:
      - 'AI_D0J_B_LAUNCH.txt'
permissions:
  actions: read
concurrency:
  group: ai-d0j-b-exact-lock-one-shot
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Rebuild and verify pinned metadata-only zero-advisory candidate
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          READONLY_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir source result
          git -C source init -q
          git -C source remote add origin https://github.com/tashfeenahmed/freellmapi.git
          git -C source fetch --depth=1 --no-tags origin 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          test "$(git -C source hash-object package-lock.json)" = 1ee6ad8e90aa6288ccc4e03402c63f11e5f7a537
          curl -fLsS --retry 3 -H "Authorization: Bearer $READONLY_ACTIONS_TOKEN" \
            https://api.github.com/repos/AGOURA-cloud/freellmapi-sca-disposable/actions/artifacts/14529460580/zip \
            --output result/verified-d0i-b-artifact.zip
          unzip -p result/verified-d0i-b-artifact.zip scoped-minimatch-package-lock.json > source/package-lock.json
          echo 'dc7799e8134eb428d38857b6392b9cb499784416cebd0e9b6fe179091138da36  source/package-lock.json' | sha256sum -c -
          rm result/verified-d0i-b-artifact.zip
          node <<'NODE'
          const fs=require('fs'),s='source/server/package.json',p=JSON.parse(fs.readFileSync(s,'utf8'));
          const fixes={undici:['^6.21.0','^6.29.1'],multer:['^2.2.0','^2.5.0'],compression:['^1.8.0','^1.8.2'],sharp:['^0.35.3','^0.35.5']};
          for(const [k,[a,b]] of Object.entries(fixes)){if(p.dependencies[k]!==a)throw Error('Pinned source mismatch '+k);p.dependencies[k]=b}
          fs.writeFileSync(s,JSON.stringify(p,null,2)+'\n');
          const f='source/package.json',root=JSON.parse(fs.readFileSync(f,'utf8'));
          if(root.overrides)throw Error('Unexpected override in upstream');
          root.overrides={'@ts-morph/common':{minimatch:'11.0.1'}};
          fs.writeFileSync(f,JSON.stringify(root,null,2)+'\n');
          NODE
          cd source
          echo 'dc7799e8134eb428d38857b6392b9cb499784416cebd0e9b6fe179091138da36  package-lock.json' | sha256sum -c -
          test ! -e node_modules
          set +e
          npm audit --json --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org > ../result/audit.json 2> ../result/audit-errors.log
          rc=$?
          set -e
          echo "$rc" > ../result/audit-exit.txt
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('../result/audit.json','utf8'));
          if(j.auditReportVersion!==2||!j.vulnerabilities||j.metadata?.vulnerabilities?.total!==0)throw Error('Audit findings remain, block runtime');
          NODE
          test "$rc" = 0
          echo PASS > ../result/candidate-gate.txt
      - name: Fetch official Node build container and record digest
        id: image
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:24.22.1-bookworm > result/docker-pull.log 2>&1
          docker image inspect node:24.22.1-bookworm --format '{{index .RepoDigests 0}}' > result/image-digest.txt
          test -s result/image-digest.txt
      - name: Install public packages with ALL lifecycle scripts disabled in disposable container
        id: install
        if: steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout -k 10s 720s docker run --rm --network bridge --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
            --memory 4g --cpus 2 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,size=2048m \
            -v "$PWD/source:/workspace:rw" -w /workspace \
            -e HOME=/tmp -e CI=true -e NPM_CONFIG_IGNORE_SCRIPTS=true \
            node:24.22.1-bookworm \
            bash -lc 'npm ci --ignore-scripts --no-audit --no-fund --cache /tmp/npm-cache --registry=https://registry.npmjs.org' > result/npm-ci.log 2>&1
          rc=$?
          set -e
          echo "$rc" > result/npm-ci-exit.txt
          test "$rc" = 0 && test -d source/node_modules
      - name: Execute offline compatibility, build, focused tests and native rebuild
        id: testing
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > source/d0j-smoke.cjs <<'NODE'
          const fs=require('fs');
          const {minimatch}=require('./node_modules/@ts-morph/common/node_modules/minimatch');
          if(typeof minimatch!=='function'||!minimatch('src/a/file.ts','src/**/*.ts')||minimatch('src/a/file.js','src/**/*.ts'))throw Error('minimatch behavior mismatch');
          const {Project}=require('ts-morph');
          const p=new Project({useInMemoryFileSystem:true});
          if(p.createSourceFile('test.ts','export const x: number = 42;').getVariableStatements().length!==1)throw Error('ts-morph in-memory AST failure');
          if(require('./node_modules/shadcn/package.json').version!=='4.23.0'||!fs.existsSync('node_modules/shadcn/tailwind.css'))throw Error('shadcn CSS or version failure');
          console.log('PASS minimatch 11, ts-morph AST, shadcn CSS');
          NODE
          box() {
            local name="$1"; shift
            set +e
            timeout -k 10s 390s docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
              --memory 4g --cpus 2 --user "$(id -u):$(id -g)" \
              --tmpfs /tmp:rw,nosuid,size=1024m \
              -v "$PWD/source:/workspace:rw" -w /workspace \
              -e HOME=/tmp -e CI=true -e CLOUDFLARE_NEURON_ANALYTICS=0 \
              -e NODE_OPTIONS=--max-old-space-size=3072 \
              node:24.22.1-bookworm bash -lc "$*" > "result/$name.log" 2>&1
            local rc=$?
            set -e
            echo "$rc" > "result/$name-exit.txt"
            echo "$name exit code: $rc"
          }
          box smoke 'node d0j-smoke.cjs'
          box build-server 'npm run build -w server'
          box build-client 'npm run build -w client'
          box build-cli 'npm run build -w cli'
          box test-server 'cd server && ../node_modules/.bin/vitest run --pool=forks --fileParallelism=false src/__tests__/lib/url-guard.test.ts src/__tests__/lib/image-normalize.test.ts'
          box test-client 'cd client && ../node_modules/.bin/vitest run src/App.test.ts'
          box rebuild-sqlite 'npm rebuild better-sqlite3 --offline --foreground-scripts --build-from-source --nodedir=/usr/local'
          box smoke-sqlite 'node -e "const DB=require(\"better-sqlite3\");const db=new DB(\":memory:\");if(db.prepare(\"select 42 as x\").get().x!==42)process.exit(1);db.close();console.log(\"SQLite OK\")"'
          exit 0
      - name: Publish fail-closed result summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          node <<'NODE'
          const fs=require('fs'),isFile=n=>fs.existsSync('result/'+n);
          const get=n=>{try{return fs.readFileSync('result/'+n+'-exit.txt','utf8').trim()}catch{return 'NOT_RUN'}};
          let v=null;try{v=JSON.parse(fs.readFileSync('result/audit.json','utf8')).metadata.vulnerabilities}catch{}
          const checks=Object.fromEntries(['smoke','build-server','build-client','build-cli','test-server','test-client','rebuild-sqlite','smoke-sqlite'].map(n=>[n,get(n)]));
          const good=isFile('candidate-gate.txt')&&get('npm-ci')==='0'&&Object.values(checks).every(x=>x==='0');
          const s={sourceCommit:'9d2b4b407b12e489ecd35320cd630d5ff97cd666',expectedLockSHA256:'dc7799e8134eb428d38857b6392b9cb499784416cebd0e9b6fe179091138da36',
            candidateVerified:isFile('candidate-gate.txt'),audit:v,installation:get('npm-ci'),installLifecycleScriptsDisabled:true,
            checks,installationNetwork:'bridge/npm registry',testNetwork:'none',NOVAUnaffected:true,
            providerInferenceCalls:0,privateCredentialsUsed:false,
            result:good?'SELECTED_ISOLATED_TESTS_PASSED_NOT_INTEGRATION_APPROVAL':'INCOMPLETE_OR_FAILED_COMPATIBILITY_NO_GO',
            integrationApproved:false};
          fs.writeFileSync('result/summary.json',JSON.stringify(s,null,2)+'\n');
          console.log('AI-D0J summary',JSON.stringify(s));
          NODE
      - name: Upload results, security evidence, and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-d0j-isolated-build-compatibility-evidence
          path: result/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail closed if any selected check did not pass
        if: always()
        shell: bash
        run: |
          node -e "const x=require('./result/summary.json');if(x.integrationApproved||x.result!=='SELECTED_ISOLATED_TESTS_PASSED_NOT_INTEGRATION_APPROVAL')process.exit(3);console.log('Only selected sandbox tests passed. NOVA integration remains blocked.');"
