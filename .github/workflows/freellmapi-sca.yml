# RESEARCH TEMPLATE. NOT INSTALLED OR ACTIVATED.
# User authorized a separate disposable public repository and one manual audit run.
# This file alone does not start any workflow; explicit manual dispatch is required.
# Run ONLY in a new PUBLIC repository containing NO NOVA source, access tokens, or secrets.
name: One-time FreeLLMAPI public dependency advisory audit
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: freellmapi-research-sca
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - name: Fetch a fixed, public, untrusted source snapshot (no install)
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin https://github.com/tashfeenahmed/freellmapi.git
          git -C source fetch --depth=1 --no-tags origin 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          test "$(git -C source hash-object package-lock.json)" = 1ee6ad8e90aa6288ccc4e03402c63f11e5f7a537
          echo "Pinned source and lockfile hash match. No upstream scripts run."
      - name: Registry-backed npm advisory query (no dependency installation)
        shell: bash
        run: |
          set -euo pipefail
          cd source
          code=0
          npm audit --json --audit-level=low --ignore-scripts \
            --registry=https://registry.npmjs.org > npm-audit-raw.json 2> npm-audit-stderr.txt || code=$?
          AUDIT_EXIT="$code" node <<'NODE'
          const fs = require('fs');
          let report = null;
          try { report = JSON.parse(fs.readFileSync('npm-audit-raw.json', 'utf8')); } catch {}
          const counts = report?.metadata?.vulnerabilities;
          const valid = report && !report.error && report.auditReportVersion &&
            report.vulnerabilities && counts &&
            ['info','low','moderate','high','critical'].every(k =>
              Number.isInteger(counts[k]) && counts[k] >= 0);
          const total = valid ? ['info','low','moderate','high','critical'].reduce((n,k)=>n+counts[k],0) : null;
          const result = !valid ? 'SCAN_UNAVAILABLE_NO_GO' : total > 0 ? 'ADVISORIES_FOUND_NO_GO' : Number(process.env.AUDIT_EXIT) !== 0 ? 'AUDIT_EXIT_MISMATCH_NO_GO' : 'NO_FINDINGS_NOT_SECURITY_APPROVAL';
          const summary = {
            result, auditExitCode: Number(process.env.AUDIT_EXIT),
            sourceCommit: '9d2b4b407b12e489ecd35320cd630d5ff97cd666',
            lockfileGitBlob: '1ee6ad8e90aa6288ccc4e03402c63f11e5f7a537',
            timestampUTC: new Date().toISOString(),
            auditReportVersion: report?.auditReportVersion ?? null,
            vulnerabilityCounts: valid ? counts : null,
            individualFindings: valid ? Object.entries(report.vulnerabilities).map(([name,f])=>({
              name, severity:f.severity, isDirect:f.isDirect, range:f.range,
              via:(Array.isArray(f.via)?f.via:[]).map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})
            })) : null
          };
          fs.writeFileSync('scan-summary.json', JSON.stringify(summary,null,2));
          fs.writeFileSync('scan-status.txt', result+'\n');
          console.log('Scan result:', result);
          console.log('Counts:', JSON.stringify(summary.vulnerabilityCounts));
          console.log('Forensic report and summary will be uploaded for manual review.');
          NODE
          sha256sum npm-audit-raw.json scan-summary.json > scan-sha256.txt
      - name: Upload evidence regardless of scan finding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freellmapi-research-sca-evidence
          path: |
            source/npm-audit-raw.json
            source/npm-audit-stderr.txt
            source/scan-summary.json
            source/scan-status.txt
            source/scan-sha256.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Make every blocked or vulnerable outcome a failed job
        if: always()
        shell: bash
        run: |
          test -f source/scan-status.txt || exit 2
          test "$(cat source/scan-status.txt)" = 'NO_FINDINGS_NOT_SECURITY_APPROVAL' || exit 3
          echo 'No advisories found in this specific registry snapshot. Still needs independent human review.'
