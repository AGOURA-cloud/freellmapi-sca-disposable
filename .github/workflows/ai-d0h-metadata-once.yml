# Temporary one-shot, public metadata-only dependency update research.
name: AI-D0H isolated semver-compatible lockfile remediation
on:
  push:
    paths:
      - 'AI_D0H_LAUNCH.txt'
permissions: {}
concurrency:
  group: ai-d0h-isolated-once
  cancel-in-progress: true
jobs:
  metadata-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - name: Pin and verify public upstream source
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin https://github.com/tashfeenahmed/freellmapi.git
          git -C source fetch --depth=1 --no-tags origin 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          test "$(git -C source hash-object package-lock.json)" = 1ee6ad8e90aa6288ccc4e03402c63f11e5f7a537
      - name: Recreate metadata-only four-fix baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/{shared,server,client,cli} result
          cp source/package.json source/package-lock.json candidate/
          for w in shared server client cli; do cp "source/$w/package.json" "candidate/$w/package.json"; done
          node <<'NODE'
          const fs=require('fs');
          const path='candidate/server/package.json', p=JSON.parse(fs.readFileSync(path,'utf8'));
          const fixes={undici:['^6.21.0','^6.29.1'],multer:['^2.2.0','^2.5.0'],compression:['^1.8.0','^1.8.2'],sharp:['^0.35.3','^0.35.5']};
          for(const [k,v] of Object.entries(fixes)){if(p.dependencies?.[k]!==v[0])throw Error('Source dependency mismatch for '+k);p.dependencies[k]=v[1]}
          fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          NODE
          cd candidate
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org > ../result/baseline-resolve.log 2> ../result/baseline-resolve-stderr.log
          test ! -e node_modules
          cp package-lock.json ../result/baseline-4fix-lock.json
          sha256sum package.json shared/package.json server/package.json client/package.json cli/package.json > ../result/manifest-hashes-before.txt
      - name: Attempt conservative automatic compatible remediation on lockfile only
        id: fix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          code=0
          npm audit fix --package-lock-only --ignore-scripts --no-fund --audit-level=low \
            --registry=https://registry.npmjs.org > ../result/audit-fix.stdout.txt 2> ../result/audit-fix.stderr.txt || code=$?
          echo "$code" > ../result/audit-fix-exit.txt
          test ! -e node_modules
          cp package-lock.json ../result/candidate-lock.json
          sha256sum package.json shared/package.json server/package.json client/package.json cli/package.json > ../result/manifest-hashes-after.txt
          sha256sum package-lock.json > ../result/candidate-lock-sha256.txt
      - name: Independent full and omit-dev advisory queries
        if: steps.fix.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          set +e
          npm audit --json --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org > ../result/full-audit.json 2> ../result/full-audit.stderr.txt
          a=$?
          npm audit --omit=dev --json --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org > ../result/production-audit.json 2> ../result/production-audit.stderr.txt
          b=$?
          set -e
          echo "$a" > ../result/full-audit-exit.txt
          echo "$b" > ../result/production-audit-exit.txt
          test ! -e node_modules
      - name: Produce a fail-closed immutable evidence summary
        if: always()
        shell: bash
        run: |
          mkdir -p result
          node <<'NODE'
          const fs=require('fs');
          const read=f=>{try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch{return null}};
          const getCounts=f=>{const j=read(f),c=j?.metadata?.vulnerabilities;
            return j?.auditReportVersion===2 && j?.vulnerabilities && c &&
            ['info','low','moderate','high','critical','total'].every(k=>Number.isInteger(c[k])&&c[k]>=0)?c:null};
          const original=read('result/baseline-4fix-lock.json'),target=read('result/candidate-lock.json');
          const full=getCounts('result/full-audit.json'),prod=getCounts('result/production-audit.json');
          const noModules=!fs.existsSync('candidate/node_modules');
          const readText=f=>{try{return fs.readFileSync(f,'utf8')}catch{return null}};
          const hashBefore=readText('result/manifest-hashes-before.txt');
          const hashAfter=readText('result/manifest-hashes-after.txt');
          const manifestsUnchanged=!!(hashBefore&&hashAfter&&hashBefore===hashAfter);
          const floor={undici:'6.29.1',multer:'2.5.0',compression:'1.8.2',sharp:'0.35.5'};
          const tracked=Object.fromEntries(Object.keys(floor).map(k=>[k,target?.packages?.['node_modules/'+k]?.version??null]));
          const satisfies=(x,y)=>{if(!x||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(x))return false;const a=x.split('.').map(Number),b=y.split('.').map(Number);return a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>=b[2]));};
          const floorsMet=Object.entries(floor).every(([k,v])=>satisfies(tracked[k],v));
          const changed=[];
          if(original?.packages&&target?.packages){
            const entries=new Set([...Object.keys(original.packages),...Object.keys(target.packages)]);
            for(const name of entries){
              const before=original.packages[name]?.version??null,after=target.packages[name]?.version??null;
              if(before!==after)changed.push({path:name,before,after});
            }
          }
          const complete=!!(original&&target&&full&&prod&&noModules&&manifestsUnchanged&&floorsMet);
          const result=!complete?'INCOMPLETE_OR_MANIFEST_CHANGED_NO_GO':full.total||prod.total?'ADVISORIES_REMAIN_NO_GO':'NO_KNOWN_ADVISORIES_BUT_RUNTIME_UNTESTED';
          const summary={result,upstreamCommit:'9d2b4b407b12e489ecd35320cd630d5ff97cd666',
            sourceGitLockBlob:'1ee6ad8e90aa6288ccc4e03402c63f11e5f7a537',
            baselinePriorFullTotal:26,full,prod,manifestsUnchanged,noModules,floorsMet,tracked,
            changedPackageCount:changed.length,changedPackages:changed,
            installedUpstreamPackages:false,executedUpstreamScripts:false,
            externalAIUsed:false,NOVAIntegrationApproved:false};
          fs.writeFileSync('result/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log('AI_D0H_SUMMARY',JSON.stringify({result,full,prod,manifestsUnchanged,noModules,floorsMet,changedPackageCount:changed.length}));
          NODE
      - name: Upload research evidence irrespective of advisory outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-d0h-remediation-metadata-evidence
          path: result/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail closed on remaining vulnerabilities or incomplete evidence
        if: always()
        shell: bash
        run: |
          test -f result/summary.json || exit 2
          node -e "const x=require('./result/summary.json');if(x.result!=='NO_KNOWN_ADVISORIES_BUT_RUNTIME_UNTESTED')process.exit(3);console.log('No reported advisories; FreeLLMAPI execution and integration remain unapproved.');"
