name: AI-D0K no-secrets offline security regression validation
on:
  push:
    paths:
      - 'AI_D0K_LAUNCH.txt'
permissions:
  actions: read
concurrency:
  group: ai-d0k-security-only-once
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Rebuild and verify pinned metadata-only zero-advisory candidate
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          READONLY_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir source result
          git -C source init -q
          git -C source remote add origin https://github.com/tashfeenahmed/freellmapi.git
          git -C source fetch --depth=1 --no-tags origin 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          git -C source checkout -q --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          test "$(git -C source hash-object package-lock.json)" = 1ee6ad8e90aa6288ccc4e03402c63f11e5f7a537
          curl -fLsS --retry 3 -H "Authorization: Bearer $READONLY_ACTIONS_TOKEN" \
            https://api.github.com/repos/AGOURA-cloud/freellmapi-sca-disposable/actions/artifacts/14529460580/zip \
            --output result/verified-d0i-b-artifact.zip
          unzip -p result/verified-d0i-b-artifact.zip scoped-minimatch-package-lock.json > source/package-lock.json
          echo 'dc7799e8134eb428d38857b6392b9cb499784416cebd0e9b6fe179091138da36  source/package-lock.json' | sha256sum -c -
          rm result/verified-d0i-b-artifact.zip
          node <<'NODE'
          const fs=require('fs'),s='source/server/package.json',p=JSON.parse(fs.readFileSync(s,'utf8'));
          const fixes={undici:['^6.21.0','^6.29.1'],multer:['^2.2.0','^2.5.0'],compression:['^1.8.0','^1.8.2'],sharp:['^0.35.3','^0.35.5']};
          for(const [k,[a,b]] of Object.entries(fixes)){if(p.dependencies[k]!==a)throw Error('Pinned source mismatch '+k);p.dependencies[k]=b}
          fs.writeFileSync(s,JSON.stringify(p,null,2)+'\n');
          const f='source/package.json',root=JSON.parse(fs.readFileSync(f,'utf8'));
          if(root.overrides)throw Error('Unexpected override in upstream');
          root.overrides={'@ts-morph/common':{minimatch:'11.0.1'}};
          fs.writeFileSync(f,JSON.stringify(root,null,2)+'\n');
          NODE
          cd source
          echo 'dc7799e8134eb428d38857b6392b9cb499784416cebd0e9b6fe179091138da36  package-lock.json' | sha256sum -c -
          test ! -e node_modules
          set +e
          npm audit --json --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org > ../result/audit.json 2> ../result/audit-errors.log
          rc=$?
          set -e
          echo "$rc" > ../result/audit-exit.txt
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('../result/audit.json','utf8'));
          if(j.auditReportVersion!==2||!j.vulnerabilities||j.metadata?.vulnerabilities?.total!==0)throw Error('Audit findings remain, block runtime');
          NODE
          test "$rc" = 0
          echo PASS > ../result/candidate-gate.txt
      - name: Fetch official Node build container and record digest
        id: image
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:24.22.1-bookworm > result/docker-pull.log 2>&1
          docker image inspect node:24.22.1-bookworm --format '{{index .RepoDigests 0}}' > result/image-digest.txt
          test -s result/image-digest.txt
      - name: Install public packages with ALL lifecycle scripts disabled in disposable container
        id: install
        if: steps.image.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout -k 10s 720s docker run --rm --network bridge --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
            --memory 4g --cpus 2 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,size=2048m \
            -v "$PWD/source:/workspace:rw" -w /workspace \
            -e HOME=/tmp -e CI=true -e NPM_CONFIG_IGNORE_SCRIPTS=true \
            node:24.22.1-bookworm \
            bash -lc 'npm ci --ignore-scripts --no-audit --no-fund --cache /tmp/npm-cache --registry=https://registry.npmjs.org' > result/npm-ci.log 2>&1
          rc=$?
          set -e
          echo "$rc" > result/npm-ci-exit.txt
          test "$rc" = 0 && test -d source/node_modules
      - name: Execute offline only selected security regression suites
        id: security
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          box() {
            local name="$1"; shift
            set +e
            timeout -k 10s 420s docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
              --memory 4g --cpus 2 --user "$(id -u):$(id -g)" \
              --tmpfs /tmp:rw,nosuid,size=1024m \
              -v "$PWD/source:/workspace:rw" -w /workspace \
              -e HOME=/tmp -e CI=true -e CLOUDFLARE_NEURON_ANALYTICS=0 \
              -e NODE_OPTIONS=--max-old-space-size=3072 \
              node:24.22.1-bookworm bash -lc "$*" > "result/$name.log" 2>&1
            local rc=$?
            set -e
            echo "$rc" > "result/$name-exit.txt"
            echo "$name exit code: $rc"
          }
          box native-rebuild 'npm rebuild better-sqlite3 --offline --foreground-scripts --build-from-source --nodedir=/usr/local'
          box auth-session 'cd server && ../node_modules/.bin/vitest run --pool=forks --fileParallelism=false src/__tests__/routes/auth.test.ts src/__tests__/routes/auth-setup-code.test.ts src/__tests__/routes/auth-login-throttle.test.ts src/__tests__/routes/auth-desktop-session.test.ts src/__tests__/routes/auth-reset-password.test.ts src/__tests__/routes/keys-desktop-reauth.test.ts'
          box mcp-and-rate 'cd server && ../node_modules/.bin/vitest run --pool=forks --fileParallelism=false src/__tests__/routes/mcp.test.ts src/__tests__/routes/settings-mcp.test.ts src/__tests__/routes/admin-rate-limit.test.ts src/__tests__/routes/proxy-rate-limit.test.ts'
          box host-cors-csp 'cd server && ../node_modules/.bin/vitest run --pool=forks --fileParallelism=false src/__tests__/routes/allowed-hosts.test.ts src/__tests__/routes/csp-security.test.ts src/__tests__/routes/proxy-auth-cors.test.ts src/__tests__/routes/proxy-auth-rotation.test.ts'
          box ssrf-credentials 'cd server && ../node_modules/.bin/vitest run --pool=forks --fileParallelism=false src/__tests__/lib/url-guard.test.ts src/__tests__/routes/keys-ssrf-guard.test.ts src/__tests__/routes/proxy-error-redaction.test.ts src/__tests__/lib/log-redaction.test.ts src/__tests__/lib/crypto.test.ts src/__tests__/db/hardening.test.ts src/__tests__/routes/error-handler-security.test.ts'
          exit 0
      - name: Summarize security regression results (fail closed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          node <<'NODE'
          const fs=require('fs');
          const exists=n=>fs.existsSync('result/'+n);
          const get=n=>{try{return fs.readFileSync('result/'+n+'-exit.txt','utf8').trim()}catch{return 'NOT_RUN'}};
          let v=null;try{v=JSON.parse(fs.readFileSync('result/audit.json','utf8')).metadata.vulnerabilities}catch{}
          const checks=Object.fromEntries(['native-rebuild','auth-session','mcp-and-rate','host-cors-csp','ssrf-credentials'].map(n=>[n,get(n)]));
          const isGood=exists('candidate-gate.txt')&&get('npm-ci')==='0'&&Object.values(checks).every(c=>c==='0')&&v?.total===0;
          const summary={stage:'AI-D0K',sourceCommit:'9d2b4b407b12e489ecd35320cd630d5ff97cd666',
            candidateSHA256:'dc7799e8134eb428d38857b6392b9cb499784416cebd0e9b6fe179091138da36',
            pinnedAuditGate:exists('candidate-gate.txt'),audit:v,
            dependencyInstallScriptsDisabled:true,installExit:get('npm-ci'),checks,
            testNetwork:'none',realProviderCalls:0,privateCredentials:false,AIModelInference:false,
            NOVAUnaffected:true,FreeLLMAPIIntegrationApproved:false,
            result:isGood?'SELECTED_SECURITY_TESTS_PASSED_WITH_OPEN_POLICY_RISKS':'SECURITY_TESTS_FAILED_OR_INCOMPLETE_NO_GO'};
          fs.writeFileSync('result/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log('AI_D0K_SECURITY_RESULT',JSON.stringify(summary));
          NODE
      - name: Upload results, security evidence, and test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-d0k-security-regression-evidence
          path: result/
          retention-days: 7
          if-no-files-found: warn
      - name: Fail closed if selected security regressions incomplete
        if: always()
        shell: bash
        run: |
          node -e "const s=require('./result/summary.json');if(s.FreeLLMAPIIntegrationApproved||s.result!=='SELECTED_SECURITY_TESTS_PASSED_WITH_OPEN_POLICY_RISKS')process.exit(3);console.log('Selected offline security regressions PASS, but external use and NOVA integration remain BLOCKED.');"
